@keyframes anc-sh{0%{opacity:0}4%{opacity:1}22%,100%{opacity:0}}
@keyframes anc-sb{0%{transform:none}5%{transform:scale(1.1)}11%,100%{transform:none}}
@keyframes anc-co{0%,21%{transform:none}25%{transform:scale(1.1)}29%{transform:scale(.97)}36%{transform:scale(1.1)}40%{transform:scale(.98)}46%,100%{transform:none}}
@keyframes anc-gp{0%,20%{opacity:.55}28%,44%{opacity:1}60%,100%{opacity:.55}}
@keyframes anc-rp{0%,40%{opacity:0;transform:scale(.9)}41%{opacity:.9;transform:scale(.9)}62%,100%{opacity:0;transform:scale(2)}}
@keyframes anc-ln{0%,30%{stroke-dashoffset:100;opacity:1}44%,86%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:0}91%,100%{stroke-dashoffset:100;opacity:0}}
@keyframes anc-ar{0%,36%{opacity:0}46%,86%{opacity:1}90%,100%{opacity:0}}
@keyframes anc-bg{0%,30%{transform:scaleY(0)}35%{transform:scaleY(1.08);animation-timing-function:ease-out}38%,71%{transform:none}74%{transform:scaleY(1.12)}78%,86%{transform:none}91%,100%{transform:scaleY(0)}}
@keyframes anc-dn{0%,33%{opacity:0;transform:rotate(-140deg) scale(.55)}42%{opacity:1;transform:rotate(8deg) scale(1.04);animation-timing-function:ease-out}46%,86%{opacity:1;transform:none}90%,100%{opacity:0;transform:scale(.8)}}
@keyframes anc-ed{0%,43%{opacity:0;transform:scale(0)}46%{opacity:1;transform:scale(1.4)}48%,86%{opacity:1;transform:none}89%,100%{opacity:0;transform:scale(0)}}
@keyframes anc-er{0%,45%{opacity:0;transform:scale(1)}46%{opacity:.9}56%{opacity:0;transform:scale(3)}71%{opacity:0;transform:scale(1)}72%{opacity:.9}82%,100%{opacity:0;transform:scale(3)}}
@keyframes anc-lv{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){
.anc-a *{animation:none!important}
.anc-ln{stroke-dashoffset:0}.anc-ar,.anc-dn,.anc-ed{opacity:1;transform:none}.anc-bg{transform:none}
.anc-pk,.anc-sh,.anc-rp,.anc-er{opacity:0}.anc-gp{opacity:.85}.anc-au{opacity:.9}.anc-du{opacity:.35}
}
</style>

