<style>
.anc-a *{transform-box:fill-box;transform-origin:center}
.anc-au{opacity:.75;transition:opacity .5s;animation:anc-br 6s ease-in-out infinite}
.group:hover .anc-au{opacity:1}
.anc-r1{animation:anc-spin 48s linear infinite}
.anc-r2{animation:anc-spin 6s linear infinite}
.anc-du{opacity:0;animation:anc-du var(--t) linear var(--o) infinite}
.anc-pk{stroke-dasharray:.01 199.99;opacity:0;animation:anc-pk 5s cubic-bezier(.5,0,.4,1) infinite}
.anc-sh{opacity:0;animation:anc-sh 5s infinite}
.anc-sb{animation:anc-sb 5s infinite}
.anc-co{animation:anc-co 5s infinite}
.anc-gp{opacity:.55;animation:anc-gp 5s infinite}
.anc-rp{opacity:0;animation:anc-rp 5s cubic-bezier(.2,.7,.3,1) infinite}
.anc-ln{stroke-dasharray:100 100;stroke-dashoffset:100;animation:anc-ln 10s cubic-bezier(.4,0,.2,1) infinite}
.anc-ar{opacity:0;animation:anc-ar 10s infinite}
.anc-bg{transform:scaleY(0);transform-origin:50% 100%;animation:anc-bg 10s infinite}
.anc-dn{opacity:0;animation:anc-dn 10s infinite}
.anc-ed{opacity:0;animation:anc-ed 10s infinite}
.anc-er{opacity:0;animation:anc-er 10s cubic-bezier(.2,.7,.3,1) infinite}
.anc-lv{animation:anc-lv 1.25s ease-in-out infinite}
@keyframes anc-spin{to{transform:rotate(360deg)}}
@keyframes anc-br{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
@keyframes anc-du{0%{transform:translateY(0);opacity:0}25%,75%{opacity:var(--a)}100%{transform:translateY(-46px);opacity:0}}
