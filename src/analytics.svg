<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="anc-a w-full h-full transform scale-[1.3] opacity-80 group-hover:opacity-100 group-hover:scale-[1.4] transition-all duration-500" role="img" aria-label="CRM, ERP, e-commerce y planillas se unifican en una sola base de datos que alimenta un panel con gráficos en vivo">
<defs>
