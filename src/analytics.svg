<radialGradient id="anc-gw"><stop offset="0" stop-color="#facc15" stop-opacity=".6"/><stop offset=".55" stop-color="#eab308" stop-opacity=".15"/><stop offset="1" stop-color="#eab308" stop-opacity="0"/></radialGradient>
