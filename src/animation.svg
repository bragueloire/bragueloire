<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="amc-a w-full h-full transform scale-[1.3] opacity-80 group-hover:opacity-100 group-hover:scale-[1.4] transition-all duration-500" role="img" aria-label="Animación digital: una forma rebota con squash and stretch siguiendo una curva de easing y se transforma en un botón de play mientras la línea de tiempo recorre sus keyframes">
<defs>
