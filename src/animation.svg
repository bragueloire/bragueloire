<style>
.amc-a *{transform-box:fill-box;transform-origin:center}
.amc-a .amc-n{transform-box:view-box;transform-origin:0 0}
.amc-a .amc-bs{transform-origin:50% 100%}
.amc-a .amc-pf{transform-box:view-box;transform-origin:170px 0}
.amc-au{opacity:.75;transition:opacity .5s;animation:amc-br 6s ease-in-out infinite}
.group:hover .amc-au{opacity:1}
.amc-r1{animation:amc-spin 48s linear infinite}
.amc-du{opacity:0;animation:amc-du var(--t) linear var(--o) infinite}
.amc-fl{animation:amc-fl 5s ease-in-out infinite}
.amc-bx{animation:amc-bx 10s var(--g,0s) infinite}
.amc-by{animation:amc-by 10s var(--g,0s) infinite}
.amc-bs{animation:amc-bs 10s var(--g,0s) infinite}
.amc-bo{opacity:0;animation:amc-bo 10s var(--g,0s) infinite}
.amc-ss{animation:amc-ss 10s infinite}
.amc-mp{opacity:0;animation:amc-mp 10s infinite}
.amc-ip{opacity:0;animation:amc-ip 10s cubic-bezier(.2,.7,.3,1) infinite}
.amc-pb{opacity:0;animation:amc-pb 10s infinite}
.amc-pr{opacity:0;animation:amc-pr 10s cubic-bezier(.2,.7,.3,1) infinite}
.amc-cv{stroke-dasharray:100 100;stroke-dashoffset:100;animation:amc-cv 10s infinite}
.amc-dx{animation:amc-dx 10s infinite}
.amc-dy{opacity:0;animation:amc-dy 10s infinite}
.amc-pf{animation:amc-pf 10s linear infinite}
.amc-po{animation:amc-po 10s linear infinite}
.amc-ph{animation:amc-ph 10s linear infinite}
@keyframes amc-spin{to{transform:rotate(360deg)}}
@keyframes amc-br{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
@keyframes amc-fl{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
@keyframes amc-du{0%{transform:translateY(0);opacity:0}25%,75%{opacity:var(--a)}100%{transform:translateY(-46px);opacity:0}}
@keyframes amc-bx{0%,4%{transform:none;animation-timing-function:linear}48%,100%{transform:translateX(200px)}}
@keyframes amc-by{0%,4%{transform:none;animation-timing-function:cubic-bezier(.11,0,.5,0)}14%{transform:translateY(174px);animation-timing-function:cubic-bezier(.5,1,.89,1)}22%{transform:translateY(40px);animation-timing-function:cubic-bezier(.11,0,.5,0)}30%{transform:translateY(174px);animation-timing-function:cubic-bezier(.5,1,.89,1)}35.5%{transform:translateY(106px);animation-timing-function:cubic-bezier(.11,0,.5,0)}41%{transform:translateY(174px);animation-timing-function:cubic-bezier(.5,1,.89,1)}44.5%{transform:translateY(146px);animation-timing-function:cubic-bezier(.11,0,.5,0)}48%,51%{transform:translateY(174px);animation-timing-function:cubic-bezier(.2,.8,.3,1)}55%,100%{transform:translateY(106px)}}
@keyframes amc-bs{0%{transform:scale(0)}3%{transform:scale(1.15)}5%{transform:none}12%{transform:scale(.9,1.12)}14%{transform:scale(1.34,.64)}16%{transform:scale(.88,1.14)}19%{transform:none}28.5%{transform:scale(.92,1.1)}30%{transform:scale(1.28,.7)}32%{transform:scale(.9,1.1)}34%{transform:none}40%{transform:scale(.95,1.06)}41%{transform:scale(1.22,.76)}43%{transform:none}48%{transform:scale(1.16,.84)}51%{transform:scale(1.36,.62)}53%{transform:scale(.8,1.28)}55.5%,100%{transform:none}}
@keyframes amc-bo{0%{opacity:0}2%,55.5%{opacity:1}57.5%,100%{opacity:0}}
@keyframes amc-ss{0%{opacity:0;transform:scale(.4)}4%{opacity:.25;transform:scale(.45);animation-timing-function:cubic-bezier(.11,0,.5,0)}14%{opacity:.95;transform:scale(1.15);animation-timing-function:cubic-bezier(.5,1,.89,1)}22%{opacity:.3;transform:scale(.5);animation-timing-function:cubic-bezier(.11,0,.5,0)}30%{opacity:.95;transform:scale(1.12);animation-timing-function:cubic-bezier(.5,1,.89,1)}35.5%{opacity:.55;transform:scale(.72);animation-timing-function:cubic-bezier(.11,0,.5,0)}41%{opacity:.95;transform:scale(1.1);animation-timing-function:cubic-bezier(.5,1,.89,1)}44.5%{opacity:.75;transform:scale(.88)}48%,51%{opacity:1;transform:scale(1.2)}56%,90%{opacity:.75;transform:scale(1.9)}95%,100%{opacity:0;transform:scale(1.4)}}
@keyframes amc-mp{0%,4%{opacity:0}9%,55%{opacity:.5}64%,100%{opacity:0}}
@keyframes amc-ip{0%,13.8%{opacity:0;transform:scale(.5)}14%{opacity:.9;transform:scale(.6)}21%,100%{opacity:0;transform:scale(2.3)}}
@keyframes amc-pb{0%,55.5%{opacity:0;transform:scale(.45)}58%{opacity:1;transform:scale(1.12)}60.5%{transform:scale(.95)}63%,88%{opacity:1;transform:none}90.5%{opacity:1;transform:scale(1.06)}94%,100%{opacity:0;transform:scale(.3)}}
@keyframes amc-pr{0%,57.5%{opacity:0;transform:none}58%{opacity:.85;transform:none}70%,100%{opacity:0;transform:scale(1.75)}}
@keyframes amc-cv{0%,4%{stroke-dashoffset:100;opacity:1;animation-timing-function:cubic-bezier(.45,0,.55,1)}48%,90%{stroke-dashoffset:0;opacity:1}95%{stroke-dashoffset:0;opacity:0}96%,100%{stroke-dashoffset:100;opacity:0}}
@keyframes amc-dx{0%,4%{transform:none;animation-timing-function:linear}48%,100%{transform:translateX(122px)}}
@keyframes amc-dy{0%{opacity:0;transform:none}4%{opacity:1;transform:none;animation-timing-function:cubic-bezier(.49,0,.51,1)}48%,90%{opacity:1;transform:translateY(-112px)}94%,100%{opacity:0;transform:translateY(-112px)}}
@keyframes amc-pf{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes amc-po{0%,94%{opacity:1}99%,100%{opacity:0}}
@keyframes amc-ph{0%{transform:none;opacity:0}2%,95%{opacity:1}100%{transform:translateX(460px);opacity:0}}
@media (prefers-reduced-motion:reduce){
.amc-a *{animation:none!important}
.amc-bo,.amc-ip,.amc-pr,.amc-dy{opacity:0}
.amc-pb{opacity:1}.amc-mp{opacity:.5}.amc-cv{stroke-dashoffset:0}.amc-au{opacity:.9}.amc-du{opacity:.35}
.amc-a .amc-pf{transform:scaleX(.57)}.amc-a .amc-ph{transform:translateX(262px)}
.amc-a .amc-sw{transform:translateX(200px)}.amc-a .amc-ss{opacity:.75;transform:scale(1.9)}
}
</style>

