<radialGradient id="amc-bl" cx=".36" cy=".32" r=".72"><stop offset="0" stop-color="#ffedd5"/><stop offset=".35" stop-color="#fb923c"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
