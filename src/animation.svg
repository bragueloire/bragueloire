<linearGradient id="amc-tr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset=".6" stop-color="#f97316"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="amc-cv" gradientUnits="userSpaceOnUse" x1="476" y1="0" x2="598" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<linearGradient id="amc-gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fdba74" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="amc-pn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16121d"/><stop offset="1" stop-color="#09080d"/></linearGradient>
<radialGradient id="amc-sh"><stop offset="0" stop-color="#f97316" stop-opacity=".55"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
<radialGradient id="amc-gw"><stop offset="0" stop-color="#fdba74" stop-opacity=".8"/><stop offset=".55" stop-color="#f97316" stop-opacity=".22"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
