.cbc-av{opacity:0;animation:cbc-av 10s infinite}
@keyframes cbc-spin{to{transform:rotate(360deg)}}
@keyframes cbc-br{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
