@keyframes cbc-gr{0%,38%{transform:scaleX(0)}44%,100%{transform:scaleX(1)}}
@keyframes cbc-cp{0%,46%{opacity:0;transform:scale(.4)}49%{opacity:1;transform:scale(1.12)}51%,100%{opacity:1;transform:none}}
@keyframes cbc-sb{0%,1%{transform:none}3%{transform:scale(.82)}5.5%{transform:scale(1.1)}8%,100%{transform:none}}
@keyframes cbc-dl{0%,13%{opacity:0}16%,36%{opacity:1}44%,84%{opacity:.55}90%,100%{opacity:0}}
@keyframes cbc-db{0%,14%{transform:none}16.5%{transform:scale(1.08)}19.5%,100%{transform:none}}
@keyframes cbc-sc{0%,15%{opacity:0;transform:translateY(0)}16.5%{opacity:1}30%{opacity:1;transform:translateY(80px)}31.5%,100%{opacity:0;transform:translateY(80px)}}
@keyframes cbc-l{0%,16%{stroke-dashoffset:100;opacity:1;animation-timing-function:cubic-bezier(.5,0,.4,1)}24%,84%{stroke-dashoffset:0;opacity:1}89%{stroke-dashoffset:0;opacity:0}90%,100%{stroke-dashoffset:100;opacity:0}}
@keyframes cbc-pk{0%,17%{stroke-dashoffset:0;opacity:0;animation-timing-function:cubic-bezier(.5,0,.4,1)}18.5%{opacity:1}26%{opacity:1}27.5%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes cbc-av{0%,12%{opacity:0;transform:scale(1)}14%{opacity:.9}24%{opacity:0;transform:scale(1.9)}25%{opacity:0;transform:scale(1)}26%{opacity:.9}36%,100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){
.cbc-a *,.cbc-a .cbc-cy{animation:none!important}
.cbc-q,.cbc-an,.cbc-cp{opacity:1;transform:none}.cbc-gr{transform:none}
.cbc-ty,.cbc-sc,.cbc-pk,.cbc-av{opacity:0}
.cbc-dl{opacity:.7}.cbc-l{stroke-dashoffset:0}.cbc-au{opacity:.9}.cbc-du{opacity:.35}
}
</style>

