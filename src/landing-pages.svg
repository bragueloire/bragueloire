@keyframes lpc-pr{0%,49.5%{transform:none}50.5%{transform:scale(.9)}53%{transform:scale(1.07)}56%,100%{transform:none}}
@keyframes lpc-cg{0%,36%{opacity:.25}40%{opacity:.7}44%{opacity:.4}47%{opacity:.75}51%{opacity:1}64%,90%{opacity:.55}96%,100%{opacity:.25}}
@keyframes lpc-ps{0%,37%{opacity:0;transform:scale(1)}38%{opacity:.8}43.5%{opacity:0;transform:scale(1.18,1.7)}44%{opacity:0;transform:scale(1)}44.5%{opacity:.8}50%,100%{opacity:0;transform:scale(1.18,1.7)}}
@keyframes lpc-rp{0%,50.5%{opacity:0;transform:scale(.6)}51%{opacity:.9;transform:scale(.6)}60%,100%{opacity:0;transform:scale(3.6)}}
@keyframes lpc-cu{0%,3%{opacity:0;transform:translate(300px,390px)}5%{opacity:1;animation-timing-function:cubic-bezier(.3,0,.2,1)}9%{transform:translate(234px,302px)}10%{transform:translate(234px,302px) scale(.8)}11.5%{transform:translate(234px,302px)}13%{opacity:1;transform:translate(234px,302px);animation-timing-function:ease-in}17%,40%{opacity:0;transform:translate(270px,350px)}42%{opacity:0;transform:translate(560px,440px)}44%{opacity:1;animation-timing-function:cubic-bezier(.3,0,.2,1)}49%{transform:translate(446px,368px)}50.5%{transform:translate(446px,368px) scale(.8)}52%{transform:translate(446px,368px)}55%{opacity:1;transform:translate(446px,368px);animation-timing-function:ease-in}59%,100%{opacity:0;transform:translate(490px,420px)}}
@keyframes lpc-bb{0%{transform:scaleY(0)}6%,51.5%{transform:scaleY(.2);animation-timing-function:cubic-bezier(.2,.9,.3,1)}57%{transform:scaleY(.97)}60%{transform:scaleY(.87)}63%,90%{transform:scaleY(.9);animation-timing-function:ease-in}97%,100%{transform:scaleY(0)}}
@keyframes lpc-ba{0%{transform:scaleY(0)}6%,90%{transform:scaleY(.16)}97%,100%{transform:scaleY(0)}}
@keyframes lpc-up{0%,55%{opacity:0;transform:translateY(18px)}59%{opacity:1;transform:translateY(-5px)}61.5%,90%{opacity:1;transform:none}94%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes lpc-bg{0%,52%{opacity:0}58%,90%{opacity:1}96%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
.lpc-a *{animation:none!important}
.lpc-ab,.lpc-bx,.lpc-ps,.lpc-rp,.lpc-cu{opacity:0}.lpc-cg{opacity:.7}.lpc-au{opacity:.9}.lpc-du{opacity:.35}
}
</style>

