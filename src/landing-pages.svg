<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="lpc-a w-full h-full transform scale-[1.3] opacity-80 group-hover:opacity-100 group-hover:scale-[1.4] transition-all duration-500" role="img" aria-label="Un clic en un anuncio aterriza en una landing mobile que se arma bloque a bloque, el botón de acción late y la conversión salta hacia arriba">
<defs>
<linearGradient id="lpc-fr" gradientUnits="userSpaceOnUse" x1="0" y1="92" x2="0" y2="408"><stop offset="0" stop-color="#11121f"/><stop offset="1" stop-color="#07070d"/></linearGradient>
<linearGradient id="lpc-hi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#4425fe"/></linearGradient>
<linearGradient id="lpc-ct" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
<linearGradient id="lpc-br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#14b8a6"/><stop offset="1" stop-color="#4425fe"/></linearGradient>
<linearGradient id="lpc-bm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6" stop-opacity="0"/><stop offset=".7" stop-color="#5eead4" stop-opacity=".5"/><stop offset=".92" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="lpc-au"><stop offset="0" stop-color="#14b8a6" stop-opacity=".36"/><stop offset=".5" stop-color="#4425fe" stop-opacity=".14"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="lpc-gw"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".75"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
<radialGradient id="lpc-sh"><stop offset="0" stop-color="#14b8a6" stop-opacity=".45"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
<clipPath id="lpc-ci"><rect x="386" y="130" width="110" height="66" rx="10"/></clipPath>
</defs>
<style>
.lpc-a *{transform-box:fill-box;transform-origin:center}
.lpc-a .lpc-n{transform-box:view-box;transform-origin:0 0}
.lpc-a .lpc-bo{transform-origin:50% 100%}
.lpc-au{opacity:.75;transition:opacity .5s;animation:lpc-br 6s ease-in-out infinite}
.group:hover .lpc-au{opacity:1}
.lpc-r1{animation:lpc-spin 48s linear infinite}
.lpc-du{opacity:0;animation:lpc-du var(--t) linear var(--o) infinite}
.lpc-fl{animation:lpc-fl 6s ease-in-out infinite}
.lpc-ad{animation:lpc-ad 12s infinite}
.lpc-ab{opacity:0;animation:lpc-ab 12s infinite}
.lpc-bx{opacity:0;animation:lpc-bx 12s cubic-bezier(.45,0,.4,1) infinite}
.lpc-cn{stroke-dasharray:.1 12.9;animation:lpc-fw .6s linear infinite}
.lpc-cw{animation:lpc-cw 12s infinite}
.lpc-p{animation:lpc-p 12s infinite backwards}
.lpc-pr{animation:lpc-pr 12s infinite}
.lpc-cg{opacity:.4;animation:lpc-cg 12s infinite}
.lpc-ps{opacity:0;animation:lpc-ps 12s infinite}
.lpc-rp{opacity:0;animation:lpc-rp 12s cubic-bezier(.2,.7,.3,1) infinite}
.lpc-cu{opacity:0;animation:lpc-cu 12s infinite}
.lpc-bb{transform:scaleY(.9);animation:lpc-bb 12s infinite}
.lpc-ba{transform:scaleY(.16);animation:lpc-ba 12s infinite}
.lpc-up{animation:lpc-up 12s infinite}
.lpc-bg{animation:lpc-bg 12s infinite}
@keyframes lpc-spin{to{transform:rotate(360deg)}}
@keyframes lpc-br{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
@keyframes lpc-fl{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
@keyframes lpc-du{0%{transform:translateY(0);opacity:0}25%,75%{opacity:var(--a)}100%{transform:translateY(-46px);opacity:0}}
@keyframes lpc-fw{to{stroke-dashoffset:-13}}
