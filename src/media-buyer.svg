<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="mbc-a w-full h-full transform scale-[1.3] opacity-80 group-hover:opacity-100 group-hover:scale-[1.4] transition-all duration-500" role="img" aria-label="El presupuesto se reparte entre tres canales de anuncios, la inversión se reequilibra hacia el canal ganador y el ROAS sube hasta 4,8x">
<defs>
<linearGradient id="mbc-cn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset=".5" stop-color="#4425fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<linearGradient id="mbc-st" gradientUnits="userSpaceOnUse" x1="224" y1="0" x2="320" y2="0"><stop offset="0" stop-color="#4425fe"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="mbc-wn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#4425fe"/></linearGradient>
<linearGradient id="mbc-ws" gradientUnits="userSpaceOnUse" x1="224" y1="0" x2="320" y2="0"><stop offset="0" stop-color="#4425fe"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
<linearGradient id="mbc-gg" gradientUnits="userSpaceOnUse" x1="498" y1="0" x2="638" y2="0"><stop offset="0" stop-color="#4425fe"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<linearGradient id="mbc-tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
<radialGradient id="mbc-au"><stop offset="0" stop-color="#4425fe" stop-opacity=".45"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".14"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="mbc-gw"><stop offset="0" stop-color="#3b82f6" stop-opacity=".5"/><stop offset="1" stop-color="#4425fe" stop-opacity="0"/></radialGradient>
<radialGradient id="mbc-sh"><stop offset="0" stop-color="#4425fe" stop-opacity=".55"/><stop offset="1" stop-color="#4425fe" stop-opacity="0"/></radialGradient>
</defs>
<style>
.mbc-a *{transform-box:fill-box;transform-origin:center}
.mbc-a .mbc-bf{transform-origin:0 50%}
.mbc-au{opacity:.75;transition:opacity .5s;animation:mbc-br 6s ease-in-out infinite}
.group:hover .mbc-au{opacity:1}
.mbc-r1{animation:mbc-spin 48s linear infinite}
.mbc-du{opacity:0;animation:mbc-du var(--t) linear var(--o) infinite}
.mbc-fl{animation:mbc-fl 6s ease-in-out infinite}
.mbc-cf{animation:mbc-cf 12s infinite}
.mbc-cr{opacity:0;animation:mbc-cr 12s infinite}
.mbc-s{stroke-dasharray:100 101;animation:mbc-s 12s infinite}
.mbc-d{stroke-dasharray:.1 7.9;animation:mbc-fw .7s linear infinite}
.mbc-dw{animation:mbc-dw 12s infinite}
.mbc-w{opacity:.95;animation:mbc-w 12s infinite}
.mbc-lo{opacity:.25;animation:mbc-lo 12s infinite}
.mbc-wg{animation:mbc-wg 12s infinite}
.mbc-rp{opacity:0;animation:mbc-rp 12s cubic-bezier(.2,.7,.3,1) infinite}
.mbc-ck{animation:mbc-ck 12s infinite}
.mbc-b1{transform:scaleX(.95);animation:mbc-b1 12s infinite}
.mbc-b2{transform:scaleX(.6);animation:mbc-b2 12s infinite}
.mbc-b3{transform:scaleX(.3);animation:mbc-b3 12s infinite}
.mbc-gf{stroke-dasharray:100 200;stroke-dashoffset:12;animation:mbc-gf 12s infinite}
.mbc-nd{transform:rotate(68deg);animation:mbc-nd 12s infinite}
.mbc-nm{animation:mbc-nm 12s infinite}
.mbc-ph{opacity:0;animation:mbc-ph 12s infinite}
.mbc-gl{animation:mbc-gl 12s infinite}
@keyframes mbc-spin{to{transform:rotate(360deg)}}
@keyframes mbc-br{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
@keyframes mbc-fl{0%,100%{transform:translateY(4px)}50%{transform:translateY(-5px)}}
@keyframes mbc-du{0%{transform:translateY(0);opacity:0}25%,75%{opacity:var(--a)}100%{transform:translateY(-46px);opacity:0}}
@keyframes mbc-fw{to{stroke-dashoffset:-8}}
@keyframes mbc-cf{0%{transform:none}2%{transform:scaleX(.08)}4.5%,42%{transform:none}44%{transform:scaleX(.08)}46.5%,100%{transform:none}}
