@keyframes mbc-wg{0%,44%{opacity:0}49%,90%{opacity:1}96%,100%{opacity:0}}
@keyframes mbc-rp{0%,46%{opacity:0;transform:scale(1)}47%{opacity:.9}58%,100%{opacity:0;transform:scale(1.7)}}
@keyframes mbc-ck{0%,47%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.25)}52%,90%{opacity:1;transform:none}94%,100%{opacity:0;transform:scale(0)}}
@keyframes mbc-b1{0%,3%{transform:scaleX(0)}10%,42%{transform:scaleX(.55);animation-timing-function:cubic-bezier(.6,0,.2,1)}50%,90%{transform:scaleX(.95);animation-timing-function:ease-in}98%,100%{transform:scaleX(0)}}
@keyframes mbc-b2{0%,4%{transform:scaleX(0)}11%,42%{transform:scaleX(.55);animation-timing-function:cubic-bezier(.6,0,.2,1)}50%,90%{transform:scaleX(.6);animation-timing-function:ease-in}98%,100%{transform:scaleX(0)}}
@keyframes mbc-b3{0%,5%{transform:scaleX(0)}12%,42%{transform:scaleX(.55);animation-timing-function:cubic-bezier(.6,0,.2,1)}50%,90%{transform:scaleX(.3);animation-timing-function:ease-in}98%,100%{transform:scaleX(0)}}
@keyframes mbc-gf{0%{stroke-dashoffset:100;opacity:0}3%{stroke-dashoffset:100;opacity:1;animation-timing-function:ease-out}11%,50%{stroke-dashoffset:72;animation-timing-function:cubic-bezier(.3,0,.2,1)}58%{stroke-dashoffset:9}62%,90%{stroke-dashoffset:12;opacity:1;animation-timing-function:ease-in}97%{stroke-dashoffset:100;opacity:1}99%,100%{stroke-dashoffset:100;opacity:0}}
@keyframes mbc-nd{0%{transform:rotate(-90deg);animation-timing-function:ease-out}11%{transform:rotate(-40deg)}22%{transform:rotate(-31deg)}34%{transform:rotate(-43deg)}50%{transform:rotate(-40deg);animation-timing-function:cubic-bezier(.3,0,.2,1)}58%{transform:rotate(75deg)}62%,90%{transform:rotate(68deg);animation-timing-function:ease-in}97%,100%{transform:rotate(-90deg)}}
@keyframes mbc-nm{0%,56%{opacity:0;transform:scale(.5)}59%{opacity:1;transform:scale(1.12)}62%,90%{opacity:1;transform:none}94%,100%{opacity:0;transform:scale(.85)}}
@keyframes mbc-ph{0%{opacity:0}6%,54%{opacity:1}57%,100%{opacity:0}}
@keyframes mbc-gl{0%,50%{opacity:.35}60%,90%{opacity:1}97%,100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
.mbc-a *{animation:none!important}
.mbc-cr,.mbc-rp,.mbc-ph{opacity:0}.mbc-au{opacity:.9}.mbc-du{opacity:.35}
}
</style>

